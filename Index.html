<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BUDGET">
    <title>Gestion de Budget</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161c2e;
            --accent-green: #22c55e;
            --accent-blue: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 24px; font-weight: 700; margin: 0; }
        .badge {
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .hero-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .hero-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-sub); }
        .hero-amount { font-size: 36px; font-weight: 800; color: var(--accent-green); margin: 8px 0; }
        .hero-sub { font-size: 12px; color: var(--text-sub); }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card-title { font-size: 12px; color: var(--text-sub); }
        .card-amount { font-size: 18px; font-weight: 700; }
        .progress-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
        }
        .progress-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        .bar-bg { background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden; }
        .bar-fill { background: var(--accent-green); height: 100%; width: 70%; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Accueil</h1>
        <span class="badge">Compte Principal</span>
    </div>

    <div class="hero-card">
        <div class="hero-title">Reste réellement disponible</div>
        <div class="hero-amount">684,00 €</div>
        <div class="hero-sub">Dépensable sans impacter vos projets</div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-title">Solde Bancaire</div>
            <div class="card-amount">2 650,00 €</div>
        </div>
        <div class="card">
            <div class="card-title">Provisions Mises à Part</div>
            <div class="card-amount">1 620,00 €</div>
        </div>
        <div class="card">
            <div class="card-title">Prélèvements à venir</div>
            <div class="card-amount">346,00 €</div>
        </div>
        <div class="card">
            <div class="card-title">Effort / Mois</div>
            <div class="card-amount">230,00 €</div>
        </div>
    </div>

    <div class="progress-card">
        <div class="progress-header">
            <span>Budget Variable Restant</span>
            <span style="color: var(--text-sub);">350 € / 500 €</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill"></div>
        </div>
    </div>
</body>
</html>
