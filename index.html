function calculatedAccountBalance(state,asOfISO){

  while(y<end.getFullYear() || (y===end.getFullYear() && m<=end.getMonth())){

function BackupRestore(p){
  const fileRef=useRef(null);

  function exportData(){
    try{
      const payload={
        version:1,
        exportedAt:new Date().toISOString(),
        app:"Budget famille",
        data:p.state
      };
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download="budget-famille-sauvegarde-"+todayISO()+".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }catch(e){
      alert("Impossible de créer la sauvegarde.");
    }
  }

  async function importFile(ev){
    const file=ev.target.files&&ev.target.files[0];
    if(!file)return;
    try{
      const text=await file.text();
      const parsed=JSON.parse(text);
      const incoming=parsed&&parsed.data?parsed.data:parsed;
      if(!incoming || typeof incoming!=="object" || !Array.isArray(incoming.categories)){
        throw new Error("Fichier invalide");
      }
      if(!confirm("Restaurer cette sauvegarde ? Les données actuellement présentes dans cette version de l’app seront remplacées.")){
        ev.target.value="";
        return;
      }
      p.onRestore(incoming);
      alert("Sauvegarde restaurée.");
    }catch(e){
      alert("Ce fichier de sauvegarde n’est pas valide.");
    }finally{
      ev.target.value="";
    }
  }

  return h("div",{className:"card p-5 mt-5"},
    h("div",{className:"text-xl font-black mb-1"},"Sauvegarde de l’app"),
    h("div",{className:"text-sm text-slate-500 mb-4"},"Permet de transférer exactement les mêmes données entre Safari, l’icône de l’écran d’accueil ou un autre appareil."),
    h("button",{onClick:exportData,className:"tap w-full rounded-2xl bg-slate-900 text-white font-black py-4 mb-3"},"⬆️ Exporter mes données"),
    h("button",{onClick:()=>fileRef.current&&fileRef.current.click(),className:"tap w-full rounded-2xl bg-blue-50 text-blue-700 font-black py-4"},"⬇️ Importer mes données"),
    h("input",{ref:fileRef,type:"file",accept:".json,application/json",onChange:importFile,style:{display:"none"}}),
    h("div",{className:"text-xs text-slate-500 mt-3"},"À faire une seule fois pour copier tes données de Safari vers l’icône de l’écran d’accueil.")
  );
}

let tesseractPromise=null;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(tesseractPromise)return tesseractPromise;
  tesseractPromise=new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error("OCR indisponible"));
    script.onerror=()=>reject(new Error("Impossible de charger le module OCR"));
    document.head.appendChild(script);
  });
  return tesseractPromise;
}
function parseEuroCandidates(text){
  const cleaned=(text||"").replace(/\u00a0/g," ");
  const patterns=[
    /(?:solde(?:\s+(?:disponible|actuel|compte|courant))?|disponible)[^\d\-+]{0,28}([\-+]?\s?\d{1,3}(?:[ .]\d{3})*(?:[,.]\d{2})?)/gi,
    /([\-+]?\s?\d{1,3}(?:[ .]\d{3})*(?:[,.]\d{2})?)\s*€/g
  ];
  const found=[];
  patterns.forEach((rx,priority)=>{
    let m;
    while((m=rx.exec(cleaned))){
      const raw=m[1].replace(/\s/g,"").replace(/\.(?=\d{3}(?:\D|$))/g,"").replace(",",".");
      const value=Number(raw);
      if(Number.isFinite(value)&&Math.abs(value)<10000000)found.push({value,priority});
    }
  });
  const seen=new Set();
  return found.filter(x=>{const k=x.value.toFixed(2);if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.priority-b.priority);
}
